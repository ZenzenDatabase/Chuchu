<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Family Memories — Login</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>
<div class="auth-page">

  <!-- Hero -->
  <div class="auth-hero">
    <div class="auth-hero-emoji">🌱</div>
    <h1>Little Memories</h1>
    <p>Watch your little ones grow, one memory at a time</p>
  </div>

  <!-- Form -->
  <div class="auth-body">
    <h2 class="auth-form-title">Welcome back 👋</h2>

    <div id="error-msg" class="error-msg"></div>

    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" type="email" id="email" placeholder="your@email.com" autocomplete="email">
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn btn-primary" id="login-btn" onclick="login()">Sign In</button>

    <div class="auth-switch" style="margin-top:16px;">
      Don't have an account? <a href="signup.html">Sign up free</a>
    </div>
  </div>
</div>

<script>
  // Redirect if already logged in
  (async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (user) window.location.href = 'feed.html';
  })();

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.classList.add('show');
  }

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');

    document.getElementById('error-msg').classList.remove('show');

    if (!email || !password) {
      showError('Please fill in all fields.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in...';

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      showError(error.message);
      btn.disabled = false;
      btn.textContent = 'Sign In';
    } else {
      window.location.href = 'feed.html';
    }
  }

  // Allow Enter key to submit
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  });
</script>
</body>
</html>
