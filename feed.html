<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <title>Family Memories -家的记忆- — Feed</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>

<div id="loading-overlay" class="loading-overlay" style="display: none;">
  <div class="spinner"></div>
  <p>Loading your memories...</p>
</div>

<div class="bg-pattern"></div>

<nav class="nav">
  <div class="container nav-inner">
    <span class="nav-title">Little <span>Moments</span></span>
    <button class="nav-btn" onclick="toggleProfile()" title="Profile">👤</button>
  </div>
</nav>

<div id="profile-panel" class="profile-panel" style="display:none;"></div>

<div class="tab-bar">
  <button class="tab-btn active" data-filter="all">🌟 All （全部）</button>
  <button class="tab-btn" data-filter="moment">📝 Moments</button>
  <button class="tab-btn" data-filter="album">📷 Albums</button>
  <button class="tab-btn" data-filter="vlog">🎬 Vlogs</button>
</div>

<div class="page">
  <div class="feed">
    <div class="posts-grid container" id="posts-grid">
      <div class="spinner"></div>
    </div>
  </div>
</div>

<a href="create.html" class="fab" title="Add memory">＋</a>

<script>
  let profileVisible = false;

  function toggleProfile() {
    const panel = document.getElementById('profile-panel');
    if (!panel) return;
    profileVisible = !profileVisible;
    panel.style.display = profileVisible ? 'flex' : 'none';
  }
</script>

<script type="module" src="js/feed.js"></script>
</body>
</html>
