<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Family Memories -独家记忆-</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>

<!-- Loading overlay -->
<div id="loading-overlay" class="loading-overlay">
  <div class="spinner"></div>
  <p>Loading...</p>
</div>

<!-- Background decoration -->
<div class="bg-pattern"></div>

<!-- Navigation -->
<nav class="nav">
  <div class="container nav-inner">
    <span class="nav-title">Family <span>Memories</span> 🥰 <span>独家</span>记忆</span>
    <button class="nav-btn" onclick="toggleProfile()" title="Profile">👤</button>
  </div>
</nav>

<!-- Profile panel (hidden by default) -->
<div id="profile-panel" class="profile-panel" style="display -显示-:none;"></div>

<!-- Tab filters -->
<div class="tab-bar">
  <button class="tab-btn active" data-filter="all">🌟 All -全部- </button>
  <button class="tab-btn" data-filter="moment">📝 Moments -文字- </button>
  <button class="tab-btn" data-filter="album">📷 Albums -照片- </button>
  <button class="tab-btn" data-filter="vlog">🎬 Vlogs -视频- </button>
</div>

<!-- Posts -->
<div class="page">
  <div class="feed">
    <div class="posts-grid container" id="posts-grid">
      <div class="spinner"></div>
    </div>
  </div>
</div>

<!-- FAB: Create new post -->
<a href="create.html" class="fab" title="Add memory">＋</a>

<script>
  let profileVisible = false;

  function toggleProfile() {
    const panel = document.getElementById('profile-panel');
    profileVisible = !profileVisible;
    panel.style.display = profileVisible ? 'flex' : 'none';
  }
</script>
<script src="js/feed.js"></script>
</body>
</html>
